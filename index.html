<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>照片管家 · X2D 审片台</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><div class="brand"><i class="lens" aria-hidden="true"></i>照片管家</div><div class="camera"><b>X2D Photo Steward</b></div><button id="finder" class="plain">显示手机选片单 ↗</button></header>
<div class="layout"><aside><div class="sidetitle">本次拍摄</div><div class="total" id="total">…</div><nav id="nav" aria-label="图库分类"></nav><div class="location"><span class="light"></span>本机图库<br><small>本次选片</small></div></aside>
<main><div id="stage"></div></main></div>
<dialog id="zoom"><button id="closeZoom" class="close" aria-label="关闭大图">×</button><img id="zoomImage" alt=""><div id="zoomCaption"></div></dialog>
<dialog id="confirmDialog"><h2>移入废纸篓？</h2><p id="confirmText"></p><div class="confirm-actions"><button id="cancel">返回核对</button><button class="danger" id="confirmRemove">确认移入废纸篓</button></div></dialog>
<dialog id="whyDialog"><div id="whyContent"></div><button id="closeWhy">关闭</button></dialog>
<dialog id="aiConsent"><h2>用 Codex 看这些照片？</h2><p id="aiDescription"></p><details class="breakdown"><summary>本次选片策略与送评范围</summary><div id="aiPolicy"></div></details><div class="confirm-actions"><button id="aiCancel">返回</button><button id="aiBegin" class="primary">开始 AI 选片</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div></body></html>
