<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>哈苏照片管家 · Photo Steward</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body>
<div class="workspace"><aside class="studio-side"><header class="side-brand"><i class="lens" aria-hidden="true"></i><div><b>哈苏照片管家</b><span>Photo Steward</span></div><button type="button" class="menu-toggle" id="menuToggle" aria-controls="nav" aria-expanded="false">导航 ▾</button></header><div class="side-count" id="total"></div><nav id="nav" aria-label="图库分类"></nav><section id="sideStrip" aria-label="组内底片"></section><div class="side-actions"><button id="finder">手机选片单 ↗</button><button id="settings">设置</button></div></aside>
<main id="stage"></main></div>
<dialog id="preferences"><h2>设置</h2><form id="prefForm"><label for="aiMode">Codex 登录方式</label><select id="aiMode"><option value="subscription">ChatGPT 订阅</option><option value="key">已登录的 API Key</option></select><p>所有本机片库共用。API Key 模式按 API 用量计费。</p><div class="confirm-actions"><button type="button" id="cancelPref">取消</button><button type="submit" class="primary">保存设置</button></div></form></dialog>
<dialog id="zoom"><button id="closeZoom" class="close" aria-label="关闭大图">×</button><img id="zoomImage" alt=""><div id="zoomCaption"></div></dialog>
<dialog id="confirmDialog"><h2>移入废纸篓？</h2><p id="confirmText"></p><div class="confirm-actions"><button id="cancel">返回核对</button><button class="danger" id="confirmRemove">确认移入废纸篓</button></div></dialog>
<dialog id="aiConsent"><h2>用 Codex 看这些照片？</h2><p id="aiDescription"></p><details class="breakdown"><summary>本次选片策略与送评范围</summary><div id="aiPolicy"></div></details><div class="confirm-actions"><button id="aiCancel">返回</button><button id="aiBegin" class="primary">开始 AI 选片</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div></body></html>
